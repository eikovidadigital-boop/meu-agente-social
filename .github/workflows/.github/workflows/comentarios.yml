name: Atendimento Comentarios Instagram

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch:          # permite rodar manualmente pelo site

permissions:
  contents: write             # pra commitar o estado de volta

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Responder comentarios
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_comentarios.py

      - name: Salvar estado (comentarios respondidos)
        run: |
          git config user.name "agente-eiko"
          git config user.email "agente@eikovida.bot"
          git add data/comentarios_respondidos.txt || true
          git commit -m "estado: comentarios respondidos" || echo "sem mudancas"
          git push || echo "nada para enviar"
