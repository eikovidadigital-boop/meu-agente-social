name: Testar Story
on:
  workflow_dispatch:        # roda manualmente pelo botao "Run workflow"

jobs:
  testar-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Gerar story de teste (sem publicar)
        run: python run_story_teste.py
      - name: Disponibilizar imagem para download
        uses: actions/upload-artifact@v4
        with:
          name: story-teste
          path: story_teste.png
