name: Ciclo Diario

on:
  schedule:
    - cron: '0 13 * * 1,3,5'   # ~10h BRT — Seg/Qua/Sex (educativo)
    - cron: '0 22 * * 2,4'     # ~19h BRT — Ter/Qui (conversao)
  workflow_dispatch:             # permite rodar manualmente

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Anti-ban (espera aleatoria 0-25 min)
        run: sleep $(( (RANDOM % 1500) ))

      - name: Rodar ciclo diario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python run_diario.py

      - name: Salvar estado (banco + indice) de volta no repo
        run: |
          git config user.name "agente"
          git config user.email "agente@bot"
          git add data/ || true
          git commit -m "estado: ciclo diario $(date -u +%Y-%m-%d)" || echo "nada a commitar"
          git push || echo "push falhou (sem mudancas?)"
