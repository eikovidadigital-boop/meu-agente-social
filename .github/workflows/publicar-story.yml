name: Publicar Story
on:
  workflow_run:
    workflows: ["Ciclo Diario"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-story:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
      PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_IMAGES_REPO: ${{ secrets.GH_IMAGES_REPO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Publicar story do produto do dia
        run: python run_story.py
      - name: Salvar historico
        run: |
          if [ -f HISTORICO_POSTS.md ]; then
            git config user.name "eikovida-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add HISTORICO_POSTS.md
            git commit -m "log: story do dia" || echo "sem mudanca"
            git push || (git pull --rebase --autostash && git push) || echo "push falhou"
          fi
